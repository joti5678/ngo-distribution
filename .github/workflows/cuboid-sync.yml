name: Daily CUBOID Stock Sync

on:
  schedule:
    # Runs at 18:15 UTC every day, which is 00:15 (12:15 AM) Dhaka time
    - cron: '15 18 * * *' 
  workflow_dispatch: # Allows you to manually trigger it via GitHub UI if needed

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # Tells GitHub where your bot files are located
    defaults:
      run:
        working-directory: ./donor-automation-bot

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install NPM Packages
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Automation Bot
        env:
          # Pulls secure keys from GitHub Secrets so they aren't public
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node cuboid_scraper.js