name: Daily CUBOID Stock Sync

on:
  schedule:
    # এটি প্রতিদিন বাংলাদেশ সময় রাত ১২:১৫ তে রান করবে (UTC 18:15)
    - cron: '54 11 * * *'
  workflow_dispatch: # গিটহাব ওয়েবসাইট থেকে ম্যানুয়ালি রান করার অপশন


jobs:
  run-automation:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./donor-automation-bot

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browsers & Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Scraper Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node run_daily.js